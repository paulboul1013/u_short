<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Shortener</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:1rem;background:#f3f4f6;color:#172033;font:1rem/1.5 system-ui,sans-serif}main{max-width:40rem;margin:8vh auto;padding:2rem;background:#fff;border-radius:1rem}h1{margin:0;text-align:center}.intro{text-align:center;color:#4b5563;margin:.25rem 0 2rem}label{display:block;font-weight:700;margin-bottom:.4rem}input,button,a{font:inherit}input{width:100%;padding:.75rem;border:2px solid #64748b;border-radius:.5rem}button{border:0;border-radius:.5rem;padding:.75rem 1rem;background:#075985;color:#fff;font-weight:700;cursor:pointer}form button{width:100%;margin-top:.75rem}button:disabled{opacity:.65}:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.result{margin-top:1.5rem;padding:1rem;background:#ecfdf5;border:1px solid #15803d;border-radius:.5rem}.result h2{margin:0 0 .5rem;font-size:1rem;color:#14532d}.result-row{display:flex;align-items:center;gap:.75rem}.short-url{min-width:0;flex:1;overflow-wrap:anywhere;user-select:text}.result a{display:inline-block;margin-top:.75rem;color:#075985;font-weight:700}.status{min-height:1.5rem;margin:1rem 0 0;font-weight:600}.error{padding:.5rem;color:#991b1b;background:#fef2f2;border-left:4px solid #b91c1c}@media(max-width:480px){main{margin:2vh auto;padding:1.25rem}.result-row{align-items:stretch;flex-direction:column}.result-row button{width:100%}}
</style>
</head>
<body>
<main>
<h1>URL Shortener</h1>
<p class="intro">Turn a long link into a short one.</p>
<form id="shorten-form" novalidate>
<label for="original-url">Original URL</label>
<input id="original-url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/article" required autofocus>
<button id="submit" type="submit">Shorten URL</button>
</form>
<section id="result" class="result" aria-labelledby="result-title" hidden>
<h2 id="result-title">Result</h2>
<div class="result-row"><output id="short-url" class="short-url"></output><button id="copy" type="button">Copy</button></div>
<a id="open" target="_blank" rel="noopener">Open short URL</a>
</section>
<p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script>
const q=id=>document.getElementById(id),f=q('shorten-form'),i=q('original-url'),b=q('submit'),r=q('result'),o=q('short-url'),a=q('open'),c=q('copy'),s=q('status');
function m(text,error=false){s.textContent=text;s.classList.toggle('error',error)}
function v(){m('Enter a valid absolute http:// or https:// URL.',true);i.focus()}
f.addEventListener('submit',async e=>{
 e.preventDefault();r.hidden=true;
 const value=i.value;
 if(!value||!/^https?:\/\//i.test(value))return v();
 b.disabled=true;b.textContent='Shortening...';m('Shortening URL...');
 try{
  const response=await fetch('/shorten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:value})});
  if(response.status===400){v();return}
  if(response.status!==201)throw 0;
  const data=await response.json();
  if(typeof data.short_url!=='string'||!data.short_url.trim())throw 0;
  const u=new URL(data.short_url);
  if(u.protocol!=='http:'&&u.protocol!=='https:')throw 0;
  o.textContent=data.short_url;
  a.href=u.href;a.hidden=false;
  r.hidden=false;m('Short URL created.');
 }catch{r.hidden=true;m("We couldn't shorten this URL. Please try again.",true)}
 finally{b.disabled=false;b.textContent='Shorten URL'}
});
c.addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText(o.textContent);c.textContent='Copied';m('Short URL copied.');setTimeout(()=>c.textContent='Copy',1600)}
 catch{m('Copy failed. The Short URL is still available to select.',true)}
});
</script>
</body>
</html>
